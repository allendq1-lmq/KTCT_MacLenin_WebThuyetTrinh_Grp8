<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bảo Tàng 3D Kinh Tế Chính Trị Mác - Lênin</title>
    <link rel="icon" href="data:," />
    <!-- Google Font tiếng Việt sắc nét chuẩn bảo tàng triển lãm (Playfair Display + Be Vietnam Pro) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CSS & Three.js CDN (Hệ thống Camera 3D Shift-Lock góc nhìn thứ ba qua vai) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="museum.css?v=20261124-1" />
  </head>
  <body
    class="bg-slate-950 text-slate-100 h-[100dvh] w-screen overflow-hidden select-none m-0 p-0 font-sans"
  >
    <!-- ================= HEADER KHÁM PHÁ TỰ DO 3D: CHỌN PHÒNG & ĐIỀU KHIỂN CAMERA ================= -->
    <header
      id="museum-top-bar"
      class="absolute top-2.5 left-2.5 right-2.5 sm:top-3.5 sm:left-4 sm:right-4 z-30 flex flex-wrap items-center justify-between gap-2 pointer-events-none"
    >
      <!-- Cụm Trái: Thanh Chọn Phòng 3D Dark Glassmorphism -->
      <nav
        aria-label="Chọn phòng trưng bày"
        class="museum-glass-bar pointer-events-auto flex items-center space-x-1 sm:space-x-1.5 p-1 sm:p-1.5 rounded-2xl"
      >
        <button
          type="button"
          class="room-btn active px-2.5 sm:px-3.5 py-1.5 text-xs sm:text-sm font-bold rounded-xl transition flex items-center gap-1.5"
          data-room="1"
        >
          <span class="room-index-pill hidden sm:inline-flex">01</span>
          <span class="museum-room-short sm:hidden">Phòng 1</span>
          <span class="museum-room-full hidden sm:inline">Phòng 1: Tổng Quan</span>
        </button>
        <button
          type="button"
          class="room-btn px-2.5 sm:px-3.5 py-1.5 text-xs sm:text-sm font-bold rounded-xl text-slate-300 hover:text-white transition flex items-center gap-1.5"
          data-room="2"
        >
          <span class="room-index-pill hidden sm:inline-flex">02</span>
          <span class="museum-room-short sm:hidden">Phòng 2</span>
          <span class="museum-room-full hidden sm:inline">Phòng 2: 5 Đặc Trưng</span>
        </button>
        <button
          type="button"
          class="room-btn px-2.5 sm:px-3.5 py-1.5 text-xs sm:text-sm font-bold rounded-xl text-slate-300 hover:text-white transition flex items-center gap-1.5"
          data-room="3"
        >
          <span class="room-index-pill hidden sm:inline-flex">03</span>
          <span class="museum-room-short sm:hidden">Phòng 3</span>
          <span class="museum-room-full hidden sm:inline">Phòng 3: Giới Hạn &amp; Giải Pháp</span>
        </button>
      </nav>

      <!-- Cụm Phải: Chuyển Góc nhìn & Trạng thái Shift-Lock -->
      <div
        id="museum-status-controls"
        class="museum-glass-bar pointer-events-auto flex items-center gap-1 sm:gap-1.5 p-1 sm:p-1.5 rounded-2xl"
      >
        <button
          id="btn-camera-mode"
          type="button"
          title="Bấm phím V để chuyển giữa Góc nhìn Thứ 3 và Thứ 1"
          class="camera-mode-btn flex items-center gap-1.5 px-2 sm:px-3 py-1.5 text-xs font-semibold rounded-xl bg-slate-900/75 text-slate-200 border border-slate-600/50 hover:bg-slate-800/80 transition"
        >
          <svg
            class="w-3.5 h-3.5 shrink-0"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
            ></path>
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
            ></path>
          </svg>
          <span id="camera-mode-short" class="sm:hidden">Góc 3</span>
          <span id="camera-mode-label" class="hidden sm:inline">Góc nhìn: Thứ 3</span>
        </button>

        <button
          id="btn-shiftlock-status"
          type="button"
          title="Bấm phím Shift để khóa/mở khóa trỏ chuột xoay góc nhìn (Shift-Lock)"
          class="flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 text-xs font-semibold rounded-xl bg-slate-900/75 text-amber-300 border border-amber-400/30 hover:bg-slate-800/80 transition"
        >
          <svg
            class="w-3.5 h-3.5 shrink-0"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
            ></path>
          </svg>
          <span>Shift-Lock</span>
          <span class="museum-shiftlock-detail">:</span>
          <span id="shiftlock-state-label" class="museum-shiftlock-detail">Giữ chuột / Phím Shift</span>
        </button>
      </div>
    </header>

    <!-- ================= CANVAS THREE.JS ================= -->
    <div id="webgl-container" class="w-full h-full"></div>

    <!-- Tâm ngắm nhỏ giữa màn hình khi bật khóa chuột Shift-Lock -->
    <div
      id="shiftlock-crosshair"
      class="hidden fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-20 pointer-events-none"
    >
      <div
        class="w-3.5 h-3.5 rounded-full border-2 border-amber-400/90 bg-slate-950/40 shadow-sm"
      ></div>
    </div>

    <!-- ================= THANH HUD CHỈ DẪN TƯƠNG TÁC HIỆN VẬT ================= -->
    <div
      id="exhibit-interact-hud"
      role="status"
      aria-live="polite"
      class="museum-interact-hud hud-hidden fixed z-[26] pointer-events-none"
    >
      <div class="hud-glass-pill">
        <span class="hud-dot" aria-hidden="true"></span>
        <div class="hud-text-group">
          <span id="hud-exhibit-title" class="hud-title">Hiện vật trưng bày</span>
          <span id="hud-interact-hint" class="hud-hint"
            >Nhấn chuột để xem chi tiết hiện vật</span
          >
        </div>
      </div>
    </div>

    <!-- ================= MODAL / NGĂN KÉO XEM ĐẦY ĐỦ NỘI DUNG HIỆN VẬT (DARK GLASSMORPHISM) ================= -->
    <div
      id="detail-drawer-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="drawer-title"
      class="hidden fixed inset-0 z-40 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-2.5 sm:p-6 pointer-events-auto"
    >
      <div
        class="museum-glass-modal rounded-2xl max-w-5xl w-full max-h-[90dvh] flex flex-col overflow-hidden animate-fade-in text-slate-100"
      >
        <div
          class="museum-glass-modal-header p-4 sm:p-5 flex items-start justify-between gap-3"
        >
          <div class="min-w-0">
            <span
              id="drawer-badge"
              class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-bold uppercase tracking-wider text-amber-300 bg-amber-500/15 border border-amber-400/30 mb-1.5"
              >Chi tiết hiện vật</span
            >
            <h3
              id="drawer-title"
              class="text-lg sm:text-2xl font-extrabold text-slate-50 leading-snug text-balance"
            >
              Tiêu đề hiện vật
            </h3>
            <p
              id="drawer-subtitle"
              class="text-xs sm:text-sm text-slate-300 italic mt-0.5"
            ></p>
          </div>
          <button
            id="btn-close-detail-drawer"
            type="button"
            aria-label="Đóng chi tiết hiện vật"
            class="museum-close-btn px-3.5 py-2 rounded-xl font-bold text-xs sm:text-sm transition shrink-0 flex items-center gap-1.5"
          >
            <svg
              class="w-4 h-4 shrink-0"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2.5"
                d="M6 18L18 6M6 6l12 12"
              ></path>
            </svg>
            <span>Đóng</span>
          </button>
        </div>
        <div
          id="drawer-body"
          class="p-4 sm:p-6 overflow-y-auto text-sm sm:text-base text-slate-200 leading-relaxed space-y-4 select-text"
        ></div>
      </div>
    </div>

    <!-- Bộ scripts thành phần của Bảo tàng 3D -->
    <script src="data.js?v=20261124-1"></script>
    <script src="visuals.js?v=20261124-1"></script>
    <script src="avatar.js?v=20261124-1"></script>
    <script src="room1.js?v=20261124-1"></script>
    <script src="room2.js?v=20261124-1"></script>
    <script src="room3.js?v=20261124-1"></script>
    <script src="controls.js?v=20261124-1"></script>
    <script src="engine.js?v=20261124-1"></script>
  </body>
</html>
